<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="버튼을 눌러 로또 6/45 행운 번호를 추첨해 보세요."
    />
    <meta name="theme-color" content="#f7f8fc" />
    <title>행운번호 - 로또 번호 추첨</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="brand" href="#" aria-label="행운번호 홈">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>행운번호</span>
        </a>
        <div class="header-actions">
          <span class="header-note">LOTTO 6/45</span>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="다크 모드로 전환"
            title="다크 모드로 전환"
            aria-pressed="false"
          >
            <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
            <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
          </button>
        </div>
      </header>

      <section class="lotto-card" aria-labelledby="page-title">
        <div class="intro">
          <span class="eyebrow"><span aria-hidden="true">✦</span> 오늘의 행운</span>
          <h1 id="page-title">로또 번호 추첨</h1>
          <p>1부터 45까지, 당신의 행운 번호를 뽑아보세요.</p>
        </div>

        <div class="ticket">
          <div class="ticket-heading">
            <div>
              <h2>행운 번호</h2>
              <p id="result-caption">버튼을 눌러 번호를 추첨해 보세요.</p>
            </div>
            <span class="ticket-badge">6개 번호</span>
          </div>

          <div id="results" class="results" aria-live="polite" aria-relevant="additions"></div>
          <div id="empty-state" class="empty-state">
            <span class="empty-icon" aria-hidden="true">?</span>
            <span>행운의 번호가 기다리고 있어요</span>
          </div>

          <button id="draw-button" class="draw-button" type="button">
            <span aria-hidden="true">✦</span>
            행운 번호 뽑기
          </button>
        </div>

        <p class="disclaimer">
          번호는 무작위로 생성되며 당첨을 보장하지 않습니다.
        </p>
      </section>

      <footer class="site-footer">
        <span>행운은 언제나 즐겁게, 가볍게 🍀</span>
        <a href="https://partnership-inquiry.pages.dev/">제휴 문의</a>
      </footer>
    </main>
  </body>
</html>
