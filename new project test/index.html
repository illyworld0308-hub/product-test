<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="버튼을 눌러 로또 6/45 행운 번호를 추첨해 보세요."
    />
    <meta name="theme-color" content="#f7f8fc" />
    <title>행운번호 - 로또 번호 추첨</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <header class="site-header">
        <a class="brand" href="#" aria-label="행운번호 홈">
          <span class="brand-mark" aria-hidden="true">L</span>
          <span>행운번호</span>
        </a>
        <div class="header-actions">
          <span class="header-note">LOTTO 6/45</span>
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="다크 모드로 전환"
            title="다크 모드로 전환"
            aria-pressed="false"
          >
            <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
            <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
          </button>
        </div>
      </header>

      <section class="lotto-card" aria-labelledby="page-title">
        <div class="intro">
          <span class="eyebrow"><span aria-hidden="true">✦</span> 오늘의 행운</span>
          <h1 id="page-title">로또 번호 추첨</h1>
          <p>1부터 45까지, 당신의 행운 번호를 뽑아보세요.</p>
        </div>

        <div class="ticket">
          <div class="ticket-heading">
            <div>
              <h2>행운 번호</h2>
              <p id="result-caption">버튼을 눌러 번호를 추첨해 보세요.</p>
            </div>
            <span class="ticket-badge">6개 번호</span>
          </div>

          <div id="results" class="results" aria-live="polite" aria-relevant="additions"></div>
          <div id="empty-state" class="empty-state">
            <span class="empty-icon" aria-hidden="true">?</span>
            <span>행운의 번호가 기다리고 있어요</span>
          </div>

          <button id="draw-button" class="draw-button" type="button">
            <span aria-hidden="true">✦</span>
            행운 번호 뽑기
          </button>
        </div>

        <p class="disclaimer">
          번호는 무작위로 생성되며 당첨을 보장하지 않습니다.
        </p>
      </section>

      <section class="inquiry-section" aria-labelledby="inquiry-title">
        <div class="inquiry-heading">
          <span class="eyebrow"><span aria-hidden="true">✉</span> 함께해요</span>
          <h2 id="inquiry-title">제휴 문의</h2>
          <p>협업 제안이나 궁금한 점을 남겨주시면 확인 후 답변드릴게요.</p>
        </div>

        <form
          class="inquiry-form"
          action="https://formspree.io/f/mjygolnb"
          method="POST"
        >
          <div class="form-field">
            <label for="inquiry-name">이름</label>
            <input
              id="inquiry-name"
              name="name"
              type="text"
              autocomplete="name"
              placeholder="홍길동"
              required
            />
          </div>

          <div class="form-field">
            <label for="inquiry-email">이메일</label>
            <input
              id="inquiry-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="name@example.com"
              required
            />
          </div>

          <div class="form-field">
            <label for="inquiry-company">회사 또는 서비스명 <span>(선택)</span></label>
            <input
              id="inquiry-company"
              name="company"
              type="text"
              autocomplete="organization"
              placeholder="회사 또는 서비스명을 입력해 주세요"
            />
          </div>

          <div class="form-field">
            <label for="inquiry-message">문의 내용</label>
            <textarea
              id="inquiry-message"
              name="message"
              rows="5"
              placeholder="제휴 제안 내용을 적어주세요."
              required
            ></textarea>
          </div>

          <input
            type="hidden"
            name="_subject"
            value="행운번호 사이트 제휴 문의"
          />

          <button class="submit-button" type="submit">문의 보내기</button>
          <p class="form-note">
            제출한 내용은 문의 답변을 위해 Formspree를 통해 전달됩니다.
          </p>
        </form>
      </section>

      <footer class="site-footer">행운은 언제나 즐겁게, 가볍게 🍀</footer>
    </main>
  </body>
</html>
